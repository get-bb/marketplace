name: Validate
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run gate:v1
      - run: npm run check
