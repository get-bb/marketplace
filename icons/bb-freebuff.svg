<svg xmlns="http://www.w3.org/2000/svg" width="252" height="252" viewBox="130 130 252 252" fill="#000" role="img" aria-label="Freebuff">
  <title>Freebuff</title>
  <!-- Official Freebuff mark (freebuff.com favicon.ico / manifest android-chrome-512x512.png),
       glyph shape only: bb.branding.icon is drawn as a currentColor CSS mask, so SVG colors are
       ignored and only alpha counts. A filled background tile would render as a solid blob. -->
  <rect x="130" y="130" width="252" height="63"/>
  <rect x="130" y="193" width="63" height="189"/>
  <rect x="212" y="211" width="125" height="63"/>
  <rect x="212" y="274" width="63" height="108"/>
</svg>
